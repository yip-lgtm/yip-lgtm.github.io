<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>outboxing stance · session</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="/yipmma/favicon.svg" />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang HK",sans-serif;min-height:100%}
    .wrap{max-width:32rem;margin:0 auto;padding:24px 16px 48px}
    a{color:#9a9a9a;text-decoration:none}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:14px;color:#9a9a9a}
    .bar{height:4px;background:#1a1a1a;border-radius:99px;overflow:hidden;margin-bottom:20px}
    .bar>i{display:block;height:100%;background:#fff;width:0}
    .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a8a8a;text-align:center}
    h1{font-size:26px;text-align:center;margin:10px 0 8px;font-weight:600;letter-spacing:-.03em}
    .clock{font-size:72px;text-align:center;margin:12px 0;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    .clock.rest{color:#8a8a8a;font-size:60px}
    .cue{color:#c4c4c4;font-size:14px;line-height:1.65}
    .gif{display:block;width:100%;max-height:220px;object-fit:contain;background:#000;border-radius:12px;margin:12px 0}
    .btns{display:flex;justify-content:center;gap:8px;margin:22px 0}
    button.icon{width:48px;height:48px;border-radius:999px;border:1px solid #2a2a2a;background:#111;color:#fff;font-size:18px}
    button.icon.pri{background:#fff;color:#000;border-color:#fff}
    .next{text-align:center;font-size:12px;color:#666}
    .done{text-align:center;padding:48px 8px}
    .done a.btn{display:inline-block;margin-top:20px;background:#fff;color:#000;border-radius:999px;padding:12px 22px}
    .mc{display:flex;flex-direction:column;gap:8px;margin:16px 0}
    .mc button{width:100%;text-align:left;border:1px solid #2a2a2a;background:#111;color:#fff;border-radius:12px;padding:12px 14px;font:inherit;line-height:1.45}
    .mc button b{display:inline-block;width:1.4em}
    .mc button small{display:block;color:#8a8a8a;margin-top:2px;font-size:12px}
    .mc button:disabled{opacity:.35}
    .tally{text-align:center;font-size:12px;color:#8a8a8a;margin:0 0 8px}
    .dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}
    .dots span{border:1px solid #2a2a2a;border-radius:999px;padding:4px 8px;font-size:11px;color:#8a8a8a}
    .dots span.full{background:#fff;color:#000;border-color:#fff}
    .mute{border:1px solid #2a2a2a;background:#111;color:#9a9a9a;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
  var muted = false;
  var audioCtx = null;
  function unlockAudio(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(e){}
  }
  function buzz(pat){
    if(muted) return;
    try{ if(navigator.vibrate) navigator.vibrate(pat); }catch(e){}
  }
  function dingAt(at, freq, dur, gain){
    if(!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    var f = audioCtx.createBiquadFilter();
    o.type = "square";
    o.frequency.setValueAtTime(freq, at);
    o.frequency.exponentialRampToValueAtTime(Math.max(80, freq * 0.62), at + dur);
    f.type = "lowpass";
    f.frequency.value = 2200;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(f); f.connect(g); g.connect(audioCtx.destination);
    o.start(at); o.stop(at + dur + 0.03);
  }
  function bell(kind){
    if(muted) return;
    unlockAudio();
    if(!audioCtx){ buzz(kind==="start"?[180]:kind==="done"?[200,80,200,80,280]:[90,50,180]); return; }
    var t0 = audioCtx.currentTime;
    if(kind === "start"){
      dingAt(t0, 980, 0.28, 0.16);
      dingAt(t0 + 0.02, 1470, 0.18, 0.07);
      buzz([160]);
    } else if(kind === "end"){
      dingAt(t0, 620, 0.42, 0.18);
      dingAt(t0 + 0.06, 410, 0.38, 0.1);
      buzz([70, 50, 170]);
    } else {
      dingAt(t0, 880, 0.26, 0.15);
      dingAt(t0 + 0.4, 880, 0.26, 0.15);
      dingAt(t0 + 0.8, 880, 0.4, 0.18);
      buzz([180, 80, 180, 80, 260]);
    }
  }
  function isSet(b){ return b && b.kind !== "rest"; }
  var SK = {
    stance:{name:"架勢",gif:"stance.gif",cue:"前腳對對手，後腳外開 45 度。重心兩腳之間，可隨時側移。唔鎖死。腳先於手。"},
    shuffle:{name:"滑步",gif:"shuffle.gif",cue:"碎步交換，幅度細，頭唔晃。隨時可停再刺拳。洛馬：步子服務角度，唔係表演。"},
    pivot:{name:"Pivot",gif:"pivot.gif",cue:"前腳為軸，後腳向外划弧 45–90 度。轉完立刻可以刺拳。離開對手發力線。"},
    ring:{name:"環繞",gif:"ring.gif",cue:"走弧唔走直線。向對手弱手外側移動，刺拳付費，3–5 秒轉節奏。"},
    jab:{name:"刺拳",gif:"jab.gif",cue:"肩先、拳後、即收。唔劈。打完側步離開。假想中身就呼氣收腹再走，唔企原位。"}
  };
  var PARTS = [
    {k:"A", id:"back", name:"背", gear:"單樅／下拉／划船／啞鈺", cue:"邊件空做邊件：單樅引體或跳上慢落、助力機、高位下拉、坐姿划、俯身啞鈺划。5–12 下，背先於手。"},
    {k:"B", id:"chest", name:"胸", gear:"塵／推胸／啞鈺／夾胸", cue:"邊件空做邊件：伏地、推胸機、啞鈺或地板推、雙樅撐、蝴蝸機或繩索夾胸。8–15 下。"},
    {k:"C", id:"bi", name:"二頭", gear:"啞鈺／拉力器／彎舉機", cue:"邊件空做邊件：啞鈺彎舉、拉力器、斜托機、反手引體或水樽、鍵式或集中彎舉。8–12 下，唔借身。"},
    {k:"D", id:"abs", name:"腹", gear:"塵／單樅／牆", cue:"抗打腹：呼氣「嗤」同時四周收緊。優先死蟲左右各 8、側平板每邊 20 秒、平板／真空、單樅提膝。腰唔拱。唔好叫人打肚。"},
    {k:"E", id:"legs", name:"大腿", gear:"啞鈺／腿機／空地／牆", cue:"邊件空做邊件：深蹲＋保加利亞（超哥）、分腿蹲、腿舉、徒手蹲＋弓步、腿伸／腿彎／登階／靠牆坐。"}
  ];
  var NEED = 3;
  var doneCount = {A:0,B:0,C:0,D:0,E:0};
  function finishedCount(){ return doneCount.A+doneCount.B+doneCount.C+doneCount.D+doneCount.E; }
  function rest(s,cue){return {label:"休息",seconds:s,kind:"rest",cue:cue||"行兩步、鼻吸口呼，唔好坐低。下一組鐘響先開始。",gear:"原地"};}
  function skill(id){var s=SK[id];return {label:"技術 · "+s.name,seconds:150,kind:"skill",cue:s.cue,gear:"空地／鏡前",gif:s.gif};}
  function lomaFirst(id, theme){
    var s = SK[id];
    return [
      {label:"進入 · 彈跳架勢",seconds:90,kind:"warmup",cue:"腳掌輕彈，肩放鬆。重心可隨時側移。洛馬原則：先識企同走，先至打。",gear:"空地／機邊"},
      skill(id),
      rest(20,"鐘響先起步。"),
      {label:"應用 1 · "+s.name,seconds:100,kind:"work",cue:theme.a1,gear:"空地",gif:s.gif},
      rest(20),
      {label:"應用 2 · "+s.name,seconds:100,kind:"work",cue:theme.a2,gear:"空地",gif:s.gif},
      rest(20),
      {label:"應用 3 · "+s.name,seconds:100,kind:"work",cue:theme.a3,gear:"空地",gif:s.gif},
      rest(20),
      {label:"角度",seconds:90,kind:"work",cue:theme.angle,gear:"空地"},
      rest(20),
      {label:"刺拳付費",seconds:90,kind:"work",cue:theme.jab+" 中身想像：呼氣收腹，側步離開。",gear:"空地",gif:"jab.gif"},
      rest(20),
      {label:"Flow 收工",seconds:60,kind:"work",cue:theme.flow,gear:"空地"}
    ];
  }
  function sculpt(){
    var out=[];
    for(var n=1;n<=15;n++){
      out.push({label:"塑形 "+n+"/15",seconds:45,kind:"mc",set:n,cue:"自由選。A 背 B 胸 C 二頭 D 腹 E 大腿。每項 3 次，共 15 組／15 分鐘。",gear:"撿空位",pick:null});
      out.push(rest(15, n<15 ? "行兩步。下一組鐘響，再自由撿 A–E。" : "完成 15 組。跟住食南瓜小米粥。"));
    }
    return out;
  }
  function dayOf(){
    var wd=new Date().toLocaleString("en-US",{timeZone:"Asia/Hong_Kong",weekday:"short"}).slice(0,3);
    var map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    return map[wd]||0;
  }
  function program(wd){
    var sc=sculpt();
    var days={
      1:{name:"洛馬 · 滑步",blocks:lomaFirst("shuffle",{a1:"前滑兩步停。頭唔晃。停完先可以刺。",a2:"後滑兩步，前腳仍指向對手。隨時可再進。",a3:"碎步轉節奏：快兩拍慢兩拍。場地擠就細步。",angle:"向外側滑半步，想像去對手弱手邊。唔直線後退。",jab:"滑步完立刻刺一拳即收，側步離開。",flow:"輕彈＋滑，唔使大力。保持可出擊。"}).concat(sc)},
      2:{name:"洛馬 · Pivot",blocks:lomaFirst("pivot",{a1:"前腳為軸，後腳划出 45 度。轉完停穩。",a2:"同一軸轉 90 度。視線跟對手，唔低頭。",a3:"轉完立刻還原再轉另一邊。幅度細都得。",angle:"Pivot 到外側，令想像對手打空。",jab:"轉完即刺，回收快過打出。",flow:"慢轉兩次，快轉一次。平衡優先。"}).concat(sc)},
      3:{name:"洛馬 · 架勢",blocks:lomaFirst("stance",{a1:"前腳在外側。膝微屈，可隨時推地。",a2:"重心前後轉換，唔鎖死後腳。",a3:"架勢中輕微預閃：頭離中線，腳先動。",angle:"前腳踩出外側半步，身體跟住，唔垮腰。",jab:"架勢穩先出刺，打完回到可移動姿勢。",flow:"企到鬆。搖一下肩，保持彈簧。"}).concat(sc)},
      4:{name:"洛馬 · 環繞",blocks:lomaFirst("ring",{a1:"走弧。每 3 秒改節奏。唔直線退。",a2:"向弱手外側行。刺拳只係入場券。",a3:"快兩步慢兩步。頭平，落地靜。",angle:"環繞半圈就停，準備出擊或再轉。",jab:"移動中出刺，腳不停死。",flow:"輕走弧收工。呼吸仍可講話。"}).concat(sc)},
      5:{name:"洛馬 · 刺拳",blocks:lomaFirst("jab",{a1:"刺即收。肩先拳後。場地擠就細動作。",a2:"1–2 再側步。唔企原位等打。",a3:"假動作半刺，再真刺。騙重心。",angle:"刺完向外側一步，離開中線。",jab:"連續 3 刺，每下都回收。最後一步離開。",flow:"輕刺保持節奏，唔加力。"}).concat(sc)},
      6:{name:"洛馬 · 移動",blocks:lomaFirst("jab",{a1:"滑＋刺：動完先打，打完再動。",a2:"Pivot 微轉再刺。轉同打分開 0.2 秒都得。",a3:"環繞兩步，刺一下離開。",angle:"組合：外側腳 → 轉角 → 停。",jab:"移動中刺，回收同時側步。",flow:"三種步各做一次，輕。"}).concat(sc)},
      0:{name:"洛馬 · 恢復",blocks:lomaFirst("stance",{a1:"慢鏡架勢。只求位置正確。",a2:"慢滑兩步。呼吸長。",a3:"慢 Pivot 45 度。唔催。",angle:"輕環繞。對話速度。",jab:"極輕刺，活動肩肘。",flow:"鼻吸 4 口呼 6。明日先加速。"}).concat(sc)}
    };
    return days[wd]||days[4];
  }
  function kindLabel(k){return {warmup:"熱身",work:"主項",rest:"休息",skill:"技術",mc:"塑形 MC",cooldown:"冷卻"}[k]||k;}
  function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
  function dotsHtml(){
    var h="";
    for(var i=0;i<PARTS.length;i++){
      var p=PARTS[i]; var n=doneCount[p.k]||0;
      h+='<span class="'+(n>=NEED?"full":"")+'">'+p.k+p.name+" "+n+"/"+NEED+"</span>";
    }
    return '<div class="dots">'+h+"</div>";
  }
  var day=program(dayOf());
  var i=0,left=day.blocks[0].seconds,run=false,done=false,timer=null;
  function total(){return day.blocks.reduce(function(a,b){return a+b.seconds;},0);}
  function elapsed(){var e=0;for(var x=0;x<i;x++)e+=day.blocks[x].seconds;return e+(day.blocks[i]?day.blocks[i].seconds-left:0);}
  function tick(){
    if(!run||done)return;
    var b=day.blocks[i];
    if(b.kind==="mc" && !b.pick) return;
    left-=1;
    if(left<=0){
      if(isSet(b)) bell("end");
      if(i+1>=day.blocks.length){done=true;run=false;if(timer)clearInterval(timer);timer=null;bell("done");render();return;}
      i+=1;left=day.blocks[i].seconds;run=false;
      if(timer){clearInterval(timer);timer=null;}
    }
    render();
  }
  function startClock(){
    var b=day.blocks[i];
    var fresh = left===b.seconds;
    run=true;
    if(fresh && isSet(b)) bell("start");
    if(!timer) timer=setInterval(tick,1000);
  }
  function bindControls(b){
    document.getElementById("go").onclick=function(){
      unlockAudio();
      if(b.kind==="mc" && !b.pick) return;
      if(run){ run=false; if(timer){clearInterval(timer);timer=null;} }
      else startClock();
      render();
    };
    document.getElementById("skip").onclick=function(){
      unlockAudio();
      if(isSet(b) && run) bell("end");
      if(i+1>=day.blocks.length){done=true;run=false;if(timer)clearInterval(timer);bell("done");render();return;}
      i+=1;left=day.blocks[i].seconds;run=false;if(timer){clearInterval(timer);timer=null;}
      render();
    };
    document.getElementById("stop").onclick=function(){location.href="/yipmma/";};
    var mu=document.getElementById("mute");
    if(mu) mu.onclick=function(){ muted=!muted; unlockAudio(); render(); };
  }
  function render(){
    var el=document.getElementById("app");
    if(done){
      var log=[];
      for(var x=0;x<day.blocks.length;x++){
        var bb=day.blocks[x];
        if(bb.kind==="mc" && bb.pick) log.push(bb.set+". "+bb.pick.k+" "+bb.pick.name);
      }
      el.innerHTML='<div class="done"><p class="kicker">洛馬 15 分 + 塑形 15 組</p><h1>'+day.name+'</h1>'+dotsHtml()+'<p class="cue">'+log.join("<br>")+'</p><p class="cue">跟住食南瓜小米粥。</p><a class="btn" href="/yipmma/">返回今日</a></div>';
      return;
    }
    var b=day.blocks[i];
    var pct=Math.min(100,Math.round(elapsed()/total()*100));
    var nxt=day.blocks[i+1];
    var half = b.kind==="mc"|| (b.kind==="rest" && i>0 && day.blocks[i-1] && day.blocks[i-1].kind==="mc") ? "塑形 15 分鐘" : "上半洛馬 15 分鐘";
    var head='<div class="top"><a href="/yipmma/">離開</a><button type="button" class="mute" id="mute">'+(muted?"鐘關":"鐘開")+'</button><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
    var controls='<div class="btns"><button class="icon pri" id="go">'+(run?"❚❚":"▶")+'</button><button class="icon" id="skip">⏭</button><button class="icon" id="stop">■</button></div>'+(nxt?'<p class="next">下一段：'+nxt.label+" · "+fmt(nxt.seconds)+"</p>":"");
    if(b.kind==="mc" && !b.pick){
      var opts="";
      for(var o=0;o<PARTS.length;o++){
        var op=PARTS[o]; var n=doneCount[op.k]||0; var full=n>=NEED;
        opts+='<button type="button" data-k="'+op.k+'"'+(full?" disabled":"")+'><b>'+op.k+'</b> '+op.name+' · '+n+'/'+NEED+'<small>'+op.gear+(full?" · 已滿 3 組":" · 空就撷")+'</small></button>';
      }
      el.innerHTML=head+'<p class="tally">自由選 · '+finishedCount()+'/15 組 · '+half+'</p><p class="kicker">A 背 B 胸 C 二頭 D 腹 E 大腿</p><h1>第 '+b.set+' 組</h1>'+dotsHtml()+'<p class="cue">邊項空撿邊項。撿完鐘響＋震機，計時 00:45。</p><div class="mc" id="mc">'+opts+"</div>"+controls;
      document.getElementById("mc").onclick=function(ev){
        var btn=ev.target.closest("button");
        if(!btn || btn.disabled) return;
        unlockAudio();
        var k=btn.getAttribute("data-k");
        var part=null;
        for(var z=0;z<PARTS.length;z++) if(PARTS[z].k===k) part=PARTS[z];
        if(!part || doneCount[k]>=NEED) return;
        doneCount[k]+=1; b.pick=part; left=b.seconds; startClock(); render();
      };
      bindControls(b);
      return;
    }
    var title=b.label, gear=b.gear, cue=b.cue;
    var gif=b.gif?('<img class="gif" alt="" src="/yipmma/skills/'+b.gif+'">'):"";
    if(b.kind==="mc" && b.pick){
      title=b.pick.k+" · "+b.pick.name+" "+doneCount[b.pick.k]+"/"+NEED;
      gear=b.pick.gear; cue=b.pick.cue;
    }
    el.innerHTML=head+(b.kind==="mc"||(b.kind==="rest" && day.blocks[i-1] && day.blocks[i-1].kind==="mc")?dotsHtml():"")+(b.kind==="mc"?'<p class="tally">塑形 '+b.set+'/15 · 已完成 '+finishedCount()+'/15</p>':'<p class="tally">'+half+'</p>')+'<p class="kicker">'+kindLabel(b.kind)+" · "+gear+"</p><h1>"+title+"</h1>"+gif+'<p class="clock'+(b.kind==="rest"?" rest":"")+'">'+fmt(left)+"</p><p class=\"cue\">"+cue+"</p>"+controls;
    bindControls(b);
  }
  render();
  </script>
</body>
</html>
