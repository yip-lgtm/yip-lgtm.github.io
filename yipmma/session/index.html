<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>outboxing stance · session</title>
<meta name="theme-color" content="#000" />
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang HK",sans-serif}
.wrap{max-width:32rem;margin:0 auto;padding:20px 16px 48px}
a{color:#9a9a9a;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:#9a9a9a}
.bar{height:4px;background:#1a1a1a;border-radius:99px;overflow:hidden;margin-bottom:16px}.bar>i{display:block;height:100%;background:#fff;width:0}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8a8a8a;text-align:center}
h1{font-size:24px;text-align:center;margin:8px 0}
.clock{font-size:68px;text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
.cue{color:#d0d0d0;font-size:14px;line-height:1.65;margin:10px 0}
.cue .en{display:block;margin-top:6px;color:#8a8a8a;font-size:13px}
.btns{display:flex;justify-content:center;gap:8px;margin:16px 0}
button.icon{min-width:48px;height:48px;border-radius:999px;border:1px solid #2a2a2a;background:#111;color:#fff}
button.icon.pri{background:#fff;color:#000;min-width:88px;font-weight:700}
.mc button{width:100%;text-align:left;border:1px solid #2a2a2a;background:#111;color:#fff;border-radius:12px;padding:12px;margin:6px 0;font:inherit}
.mc small{display:block;color:#8a8a8a;margin-top:4px;font-size:12px;line-height:1.45}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.dots span{border:1px solid #2a2a2a;border-radius:999px;padding:4px 8px;font-size:11px;color:#8a8a8a}
.dots span.full{background:#fff;color:#000}
.next,.tally{text-align:center;color:#8a8a8a;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/yipmma/session/cues.js?v=mc42"></script>
</body>
</html>
