<!doctype html><html><head><meta charset="utf-8"/><script>
(function(){
  var p=location.pathname||"";
  var dest="/yipmma/";
  if(/weight/.test(p)) dest="/yipmma/weight/";
  else if(/week/.test(p)) dest="/yipmma/#/week";
  else if(/skills/.test(p)) dest="/yipmma/#/skills";
  else dest="/yipmma/"+(location.hash||"");
  location.replace(dest);
})();
</script></head><body></body></html>
