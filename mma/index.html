    <script>
      const SHORTS = [
        ["qpgtrzJpSIE", "今日練腳 3 個動作"],
        ["9g8fGj_fO_g", "每日健身 1"],
        ["8tTcdROhKk4", "每日健身 2"],
        ["sJbZVqZc7KA", "每日健身 3"],
        ["dDMEsWZW6yg", "每日健身 4"],
      ];
      function card(html) {
        const el = document.createElement("div");
        el.className = "rounded-[16px] border border-[#2c2d26] bg-[#1a1b17] p-4 mb-4";
        el.innerHTML = html;
        return el;
      }
      function apply() {
        document.title = "outboxing stance";
        document.querySelectorAll("p,h1").forEach((el) => {
          const t = (el.textContent || "").trim();
          if (t === "康文署 · 30 分鐘" || t === "OUTBOXING STANCE") el.textContent = "OUTBOXING";
          if (t === "蝶刺") el.textContent = "outboxing stance";
          if (t === "外圍移動 · 每日塑形" || t === "stance") el.textContent = "練拳不練功到老一場空";
        });
        if (document.querySelector(".chao-injected")) return;
        const grids = [...document.querySelectorAll("div")].filter((d) =>
          d.className && String(d.className).includes("grid-cols-4")
        );
        const grid = grids.find((g) => (g.textContent || "").includes("引體"));
        if (!grid) return;
        grid.classList.remove("grid-cols-4");
        grid.classList.add("grid-cols-5");
        const thigh = document.createElement("div");
        thigh.className = grid.firstElementChild ? grid.firstElementChild.className : "";
        thigh.innerHTML = '<p class="text-xs text-muted">大腿</p><p class="mt-1 text-sm leading-tight text-fg">深蹟（超哥）</p>';
        grid.appendChild(thigh);
        const wrap = grid.parentElement;
        if (!wrap) return;
        const videos = card(
          '<p class="text-xs" style="color:#9a978c">超哥 · 梁功超</p>' +
          '<h2 class="mt-1 font-display text-xl">跟住我做保證不會翻車</h2>' +
          '<p class="mt-2 text-sm" style="color:#9a978c">每日健身系列。今日加大腿。跟住做，唔好自己加花。</p>' +
          "<ul class='mt-3 space-y-2'>" +
          SHORTS.map(([id, title]) =>
            `<li><a href="https://youtube.com/shorts/${id}" target="_blank" rel="noreferrer" class="text-sm underline underline-offset-4" style="color:#fff">${title} →</a></li>`
          ).join("") +
          "</ul>"
        );
        videos.classList.add("chao-injected");
        const diet = card(
          '<h2 class="font-display text-xl">超哥：練完即食小米粥</h2>' +
          '<p class="mt-2 text-sm leading-relaxed" style="color:#9a978c">練完立即食小米粥。小米健脾，脾主肌肉及統血。粥要淡、熱、易消化，再補蛋白。</p>'
        );
        wrap.insertBefore(diet, grid.nextSibling);
        wrap.insertBefore(videos, grid.nextSibling);
      }
      const obs = new MutationObserver(apply);
      obs.observe(document.documentElement, { childList: true, subtree: true });
      apply();
    </script>
