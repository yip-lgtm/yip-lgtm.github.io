<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <title>CSDI Slopes Map · Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin:0; font-family: system-ui, sans-serif; }
    #map { height: 100vh; }
    .panel { position: absolute; top: 10px; left: 50px; z-index: 1000; background: rgba(255,255,255,0.95); padding: 10px 14px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.2); font-size: 14px; max-width: 320px; }
    .panel input { margin: 4px 0; padding: 4px 8px; width: 180px; }
    .panel button { padding: 4px 10px; margin-left: 4px; }
    .status { font-size: 12px; color: #555; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="panel">
    CEDD Registered Man-made Slopes · <a href="https://portal.csdi.gov.hk/" target="_blank">CSDI</a><br>
    <input id="search" placeholder="輸入 SLOPE_NO" />
    <button onclick="searchSlope()">搜尋／高亮</button>
    <button onclick="resetHighlight()">重置</button>
    <div class="status" id="status">移動地圖以載入斜坡…</div>
    <br><a href="index.html">← 返回</a>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([22.34, 114.05], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const FEATURE_URL = 'https://portal.csdi.gov.hk/server/rest/services/common/cedd_rcd_1636517655915_91216/FeatureServer/0/query';
    let geoLayer = null;
    let highlighted = null;
    let loadTimer = null;

    function defaultStyle() {
      return { color: '#e67e22', weight: 2, fillColor: '#f39c12', fillOpacity: 0.35 };
    }
    function highlightStyle() {
      return { color: '#c0392b', weight: 4, fillColor: '#e74c3c', fillOpacity: 0.7 };
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function resetHighlight() {
      if (highlighted && geoLayer) {
        geoLayer.resetStyle(highlighted);
        highlighted = null;
      }
    }

    function searchSlope() {
      const q = document.getElementById('search').value.trim();
      if (!q || !geoLayer) return;
      resetHighlight();
      let found = null;
      geoLayer.eachLayer(layer => {
        const no = (layer.feature.properties.SLOPE_NO || '').trim();
        if (no === q || no.includes(q)) found = layer;
      });
      if (found) {
        found.setStyle(highlightStyle());
        highlighted = found;
        map.fitBounds(found.getBounds(), { padding: [40, 40], maxZoom: 17 });
        found.openPopup();
      } else {
        alert('當前視野找不到：' + q + '\n請先移動地圖到相關區域');
      }
    }

    function loadBbox() {
      const b = map.getBounds();
      const xmin = b.getWest(), ymin = b.getSouth();
      const xmax = b.getEast(), ymax = b.getNorth();
      const url = FEATURE_URL +
        '?where=1%3D1' +
        '&geometry=' + xmin + ',' + ymin + ',' + xmax + ',' + ymax +
        '&geometryType=esriGeometryEnvelope' +
        '&inSR=4326' +
        '&spatialRel=esriSpatialRelIntersects' +
        '&outFields=SLOPE_NO,DISTRICT,LOCATION,MAINT_PART,OVERALL_HT,OVERALL_AN' +
        '&returnGeometry=true' +
        '&f=geojson' +
        '&resultRecordCount=80';

      setStatus('載入中…');
      fetch(url)
        .then(r => r.json())
        .then(geojson => {
          if (geoLayer) map.removeLayer(geoLayer);
          geoLayer = L.geoJSON(geojson, {
            style: defaultStyle,
            onEachFeature: (f, layer) => {
              const p = f.properties || {};
              const html = `
                <b>${p.SLOPE_NO || 'N/A'}</b><br>
                地區：${p.DISTRICT || '-'}<br>
                位置：${p.LOCATION || '-'}<br>
                維修責任：${p.MAINT_PART || '-'}<br>
                高度：${p.OVERALL_HT != null ? p.OVERALL_HT + ' m' : '-'}<br>
                角度：${p.OVERALL_AN != null ? p.OVERALL_AN + '°' : '-'}
              `;
              layer.bindPopup(html);
            }
          }).addTo(map);
          const n = geojson.features ? geojson.features.length : 0;
          setStatus('已載入 ' + n + ' 幅斜坡（最多 80）');
        })
        .catch(err => {
          console.error(err);
          setStatus('載入失敗');
        });
    }

    function scheduleLoad() {
      clearTimeout(loadTimer);
      loadTimer = setTimeout(loadBbox, 400);
    }

    map.on('moveend', scheduleLoad);
    map.on('zoomend', scheduleLoad);
    document.getElementById('search').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchSlope();
    });

    // initial load
    loadBbox();
  </script>
</body>
</html>
