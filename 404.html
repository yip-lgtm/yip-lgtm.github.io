<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <title>outboxing stance</title>
  <script>
  (function () {
    var p = location.pathname || "";
    if (p.indexOf("/yipmma") === 0) {
      if (/weight/.test(p)) {
        location.replace("/yipmma/weight/");
        return;
      }
      var rest = p.replace(/^\/yipmma\/?/, "").replace(/\/$/, "");
      location.replace("/yipmma/" + (rest ? "#/" + rest : ""));
      return;
    }
    if (p.indexOf("/mma") === 0) {
      location.replace("/mma/");
      return;
    }
    location.replace("/");
  })();
  </script>
</head>
<body></body>
</html>
