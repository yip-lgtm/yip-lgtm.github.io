<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <title>outboxing stance</title>
  <script>
  (function () {
    var p = location.pathname || "";
    if (p.indexOf("/mma") === 0 && p.indexOf("/yipmma") !== 0) return;
    if (/\/yipmma\/weight/.test(p)) {
      location.replace("/yipmma/weight/");
      return;
    }
    if (p.indexOf("/yipmma") === 0) {
      var rest = p.replace(/^\/yipmma\/?/, "").replace(/\/$/, "");
      location.replace("/yipmma/" + (rest ? "#/" + rest : "") + location.hash);
      return;
    }
    location.replace("/yipmma/");
  })();
  </script>
</head>
<body></body>
</html>
