name: history-campaign

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# These three jobs all append to cute/feed.json. Two of them running at once
# each add a campaign to the same JSON array, and the rebase that follows the
# push cannot merge two arrays -- it stops with a conflict in feed.json and
# the job dies with its campaign still in memory. The group is shared on
# purpose: a per-workflow group does not stop these three from overlapping.
concurrency:
  group: cute-feed-writers
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write one bilingual campaign dossier
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          FEED_OUT: cute/feed.json
        run: node scripts/history-campaign.mjs
      # The writer names a theater the app has never heard of, and the map
      # needs a position for it. Top the gazetteer up from the ones it does
      # not know, so the campaign lands where it was fought.
      - name: Place the campaigns that have no position
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          FEED_OUT: cute/feed.json
        continue-on-error: true
        run: node scripts/backfill-theaters.mjs
      - name: Commit
        run: |
          git config user.name "yip-lgtm"
          git config user.email "258986088+yip-lgtm@users.noreply.github.com"
          git add cute/feed.json cute/theater-places.json cute/dossiers
          git diff --staged --quiet || git commit -m "Hourly bilingual campaign dossier from MiniMax."
          # Another job may have pushed while this one was writing -- the
          # Pages repo is written by four workflows and the app repo
          # publishes into it too. Rebasing onto the remote keeps this job's
          # file and drops nothing; a bare push was rejected and the work
          # was lost with it.
          git pull --rebase --autostash origin main
          git push
