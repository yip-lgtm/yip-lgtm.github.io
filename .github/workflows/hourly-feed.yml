name: hourly-feed
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Order matters: brief, then a bilingual dossier, then one portrait.
      # The brief is the only step allowed to fail the job — the other two are
      # enrichment, and losing them must not cost a campaign entry.
      - name: Add one campaign
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          FEED_OUT: cute/feed.json
        run: node scripts/hourly-feed.mjs
      - name: Add one bilingual dossier
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          FEED_OUT: cute/feed.json
        continue-on-error: true
        run: node scripts/history-campaign.mjs
      # Best effort: an image API hiccup or a layout guard must not stop the
      # commit. Exits 0 when every card already has art, and wires an on-disk
      # image with no catalog reference without calling the API at all.
      - name: Try one portrait
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        continue-on-error: true
        run: node scripts/portrait-tick.mjs
      # Read-only. Warns when this repo and the source catalog disagree about
      # which cards have art. Non-strict so a fetch hiccup cannot block a commit.
      - name: Check portrait drift against the source catalog
        run: node scripts/portrait-drift-check.mjs
      - name: Commit
        run: |
          git config user.name "yip-lmt"
          git config user.email "258986088+yip-lmt@users.noreply.github.com"
          # portraits + assets + index.html are the portrait step's output; the
          # bundle is re-hashed each run so the old asset is staged as a delete.
          git add cute/feed.json cute/portraits cute/assets cute/index.html
          git diff --staged --quiet || git commit -m "Hourly campaign and portrait from MiniMax."
          git push
