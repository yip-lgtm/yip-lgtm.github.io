name: portrait-tick
on:
  schedule:
    # every 30 minutes, deliberately off :00 and :30 — GitHub delays top-of-hour runs
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portrait-tick
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Add one 立繪 and wire it into the roster
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          COMMIT: "1"
        # exits 2 if another bot moved main while the image was generating;
        # the next scheduled run picks up the newer bundle and continues
        continue-on-error: false
        run: node scripts/portrait-tick.mjs
