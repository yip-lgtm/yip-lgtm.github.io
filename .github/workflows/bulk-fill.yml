name: bulk-fill
on:
  # The war index holds every conflict the source lists document, and the
  # hourly job writes one campaign an hour. The bulk job writes as many as
  # the plan allows, so a backlog does not take a year to drain.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bulk-fill
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write campaigns and dossiers
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          BULK_LIMIT: "20"
          DOSSIER_LIMIT: "20"
        run: node scripts/bulk-fill.mjs
      - name: Commit
        run: |
          git config user.name "yip-lgtm"
          git config user.email "258986088+yip-lgtm@users.noreply.github.com"
          git add cute/feed.json cute/dossiers
          git diff --staged --quiet || git commit -m "Campaigns and dossiers from MiniMax."
          git pull --rebase --autostash origin main
          git push
