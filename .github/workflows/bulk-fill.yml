name: bulk-fill
on:
  # The war index holds every conflict the source lists document. The site
  # grows three cards a day: the script counts what it already added today
  # and only writes what is left of the three. It runs hourly so a day whose
  # quota window was closed can still catch up on a later run.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# These three jobs all append to cute/feed.json. Two of them running at once
# each add a campaign to the same JSON array, and the rebase that follows the
# push cannot merge two arrays -- it stops with a conflict in feed.json and
# the job dies with its campaign still in memory. The group is shared on
# purpose: a per-workflow group does not stop these three from overlapping.
concurrency:
  group: cute-feed-writers
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write campaigns and dossiers
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # Three a day, each with its own bilingual full text.
          BULK_LIMIT: "3"
          DOSSIER_LIMIT: "3"
          BULK_WORKERS: "3"
        run: node scripts/bulk-fill.mjs
      - name: Sweep back to traditional Chinese
        run: node scripts/fix-trad.mjs cute
      - name: Commit
        run: |
          git config user.name "yip-lgtm"
          git config user.email "258986088+yip-lgtm@users.noreply.github.com"
          git add cute/feed.json cute/dossiers
          git diff --staged --quiet || git commit -m "Campaigns and dossiers from MiniMax."
          git pull --rebase --autostash origin main
          git push
