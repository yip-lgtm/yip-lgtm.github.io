<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機械工程知識地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1618;--panel:#152024;--ink:#e3ecec;--muted:#93a4a9;--line:#2a3b40;--accent:#43c2cb;--fore:#eb9b4c;--chip:#1d2c30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC",system-ui,sans-serif;padding:0 16px 100px}
.wrap{max-width:900px;margin:0 auto}
header{padding:32px 0 8px}
.eyebrow{font:600 .78rem "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(1.6rem,6vw,2.6rem);font-weight:900;margin:.2rem 0 .4rem}
.lede{color:var(--muted);margin:0 0 16px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.toc a{font-size:.9rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px;background:var(--panel);display:inline-flex;gap:6px;align-items:center;min-height:44px}
.toc a:active{border-color:var(--accent)}
.toc span{font:600 .75rem "IBM Plex Mono",monospace;color:var(--accent);background:var(--chip);border-radius:999px;padding:2px 8px}
section{margin-top:36px;scroll-margin-top:16px}
.sec-no{font:600 .8rem "IBM Plex Mono",monospace;color:var(--muted)}
h2{font-size:1.4rem;font-weight:900;margin:.2rem 0 .4rem}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.controls{display:flex;flex-direction:column;gap:14px;margin-bottom:10px}
.ctl label{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--accent);height:44px}
.fig svg{width:100%;height:auto;display:block;background:#0f181b;border-radius:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--chip)}
.card .k{font-size:.78rem;color:var(--muted)}
.card .v{font:600 1.2rem "IBM Plex Mono",monospace}
.note{font-size:.82rem;color:var(--muted);margin-top:8px}
@media(min-width:600px){.controls{flex-direction:row;flex-wrap:wrap}.ctl{flex:1;min-width:160px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Self-study</div>
  <h1>機械工程知識地圖</h1>
  <p class="lede">31 個單元。拖動參數，圖即時更新。</p>
  <nav class="toc" id="toc"></nav>
</header>
<div id="units"></div>
<p style="margin-top:24px"><a href="https://yip-lgtm.github.io/hd-me-lab/#/solidworks" style="color:var(--accent)">← Lab</a></p>
</div>
<script>
const U = [
['01','基礎底座','機原、材力、機設、手冊','cards',[['機原','運動學'],['材力','強度剛度'],['機設','標準件'],['手冊','查表']]],
['02','彈簧 F=kx','拖動 k 同 x',[['k',2,40,10],['x',0,20,5]],function(p){return 'F = '+(p.k*p.x).toFixed(0)+' N';}],
['03','簡支樑撞度','δ = FL³/(48EI)',[['F',200,4000,1000],['L',400,1600,800]],function(p){return 'δ = '+(p.F*Math.pow(p.L,3)/(48*200000*1e5)).toFixed(2)+' mm';}],
['04','齒輪比','i = z2/z1',[['z1',12,40,20],['z2',20,80,40]],function(p){return 'i = '+(p.z2/p.z1).toFixed(2);}],
['05','應力集中','Kt 概念',[['dw',0.1,0.6,0.3]],function(p){return 'Kt ≈ '+(2+2*p.dw).toFixed(2);}],
['06','伯努利','動壓 0.5ρv²',[['v',1,20,5]],function(p){return '動壓 = '+(0.5*1000*p.v*p.v/1000).toFixed(1)+' kPa';}],
['07','螺栓預緊','Fi ≈ T/(0.2d)',[['T',5,80,20],['d',6,20,10]],function(p){return 'Fi ≈ '+(p.T/(0.2*(p.d/1000))/1000).toFixed(1)+' kN';}],
['08','共振放大','頻率比 + 阻尼',[['r',0.2,2,0.8],['z',0.01,0.3,0.05]],function(p){return '放大 = '+(1/Math.sqrt(Math.pow(1-p.r*p.r,2)+Math.pow(2*p.z*p.r,2))).toFixed(2)+'×';}],
['09','疲勞 S-N','N = C/σa³',[['sa',50,400,200]],function(p){return 'N ≈ '+(1e14/Math.pow(p.sa,3)).toExponential(1);}],
['10','網格概念','網格越細越準',[['n',2,12,4]],function(p){return p.n+' × 2 單元';}],
['11','熱膨脹','δL = αLΔT',[['L',100,2000,500],['dT',10,200,50]],function(p){return 'δL ≈ '+(12e-6*p.L*p.dT).toFixed(2)+' mm';}],
['12','扭轉角','θ = TL/(GJ)',[['T',10,200,50],['L',100,1000,300]],function(p){return 'θ ≈ '+(p.T*p.L/(80e3*1e5)*1000).toFixed(2)+'°';}],
['13','安全係數','n = σy/σ',[['sy',200,800,400],['s',50,400,150]],function(p){return 'n = '+(p.sy/p.s).toFixed(2);}],
['14','帶傳動比','i = D2/D1',[['D1',50,200,80],['D2',80,400,160]],function(p){return 'i = '+(p.D2/p.D1).toFixed(2);}],
['15','軸承壽命','L10 ∝ (C/P)³',[['C',5,50,20],['P',1,20,5]],function(p){return 'L10 ≈ '+(Math.pow(p.C/p.P,3)*1e6).toExponential(1);}],
['16','雷諾數','Re = ρvD/μ',[['v',0.1,5,1],['D',10,100,25]],function(p){return 'Re ≈ '+(1000*p.v*(p.D/1000)/0.001).toFixed(0);}],
['17','管道壓降','Δp ∝ Lv²',[['v',1,10,3],['L',5,50,20]],function(p){return 'Δp ≈ '+(0.02*(p.L/0.05)*500*p.v*p.v/1000).toFixed(1)+' kPa';}],
['18','彈簧能量','U = 0.5kx²',[['k',5,50,15],['x',1,15,5]],function(p){return 'U = '+(0.5*p.k*p.x*p.x).toFixed(1)+' N·mm';}],
['19','應力應變','E = σ/ε',[['s',50,400,150]],function(p){return 'ε = '+(p.s/200000*100).toFixed(3)+' %';}],
['20','彎矩','M = FL/4',[['F',100,2000,500],['L',200,1000,600]],function(p){return 'M = '+(p.F*p.L/4/1000).toFixed(1)+' N·m';}],
['21','凸輪升程','最大升程',[['h',5,30,15]],function(p){return '最大 '+p.h+' mm';}],
['22','四桿機構','曲柄角度',[['th',0,360,45]],function(p){return '輸出 ≈ '+(p.th*0.6).toFixed(0)+'°';}],
['23','接觸應力','Hertz 簡化',[['F',100,2000,500],['R',5,50,20]],function(p){return 'σ ≈ '+(Math.sqrt(p.F/p.R)*10).toFixed(0)+' MPa';}],
['24','Goodman','平均應力影響',[['sa',50,300,100],['sm',0,300,50]],function(p){return '等效 ≈ '+(p.sa/(1-p.sm/400)).toFixed(0);}],
['25','公差堆疊','線性堆疊',[['t1',0.01,0.2,0.05],['t2',0.01,0.2,0.05]],function(p){return '±'+((p.t1+p.t2)/2).toFixed(3);}],
['26','自然頻率','fn ∝ 1/L²',[['L',300,1500,600]],function(p){return 'fn ≈ '+(200/Math.pow(p.L/1000,2)).toFixed(1)+' Hz';}],
['27','流體粘度','μ 影響 Re',[['mu',0.5,5,1]],function(p){return 'Re ∝ '+(1000/p.mu).toFixed(0);}],
['28','熱傳導','Q = kAΔT/L',[['dT',10,100,40],['L',5,50,20]],function(p){return 'Q ≈ '+(50*0.01*p.dT/(p.L/1000)).toFixed(0)+' W';}],
['29','網格收斂','細分次數',[['n',1,5,2]],function(p){return '誤差 ≈ '+(10/Math.pow(2,p.n)).toFixed(2)+'%';}],
['30','應用地圖','不同目標組合','cards',[['考研','機原+機設+材力'],['自動化','手冊+ANSYS'],['高端','振動+疲勞+ABAQUS'],['流體','流體+CFD']]],
['31','記住','數值都係簡化示意','cards',[['理論','先於按鈕'],['手冊','查表'],['軟體','驗證'],['實驗','最後']]]
];

function fig(no, p) {
  if (no==='02') return '<svg viewBox="0 0 360 70"><rect x="30" y="25" width="'+(50+p.x*5)+'" height="25" rx="3" fill="#1d2c30" stroke="#43c2cb"/><text x="40" y="60" fill="#93a4a9" font-size="11">x='+p.x+'</text></svg>';
  if (no==='03') { var d=p.F*Math.pow(p.L,3)/(48*200000*1e5); var drop=Math.min(30,d*5); return '<svg viewBox="0 0 360 70"><line x1="20" y1="40" x2="340" y2="40" stroke="#2a3b40"/><path d="M40 40 Q180 '+(40+drop)+' 320 40" fill="none" stroke="#43c2cb" stroke-width="3"/></svg>'; }
  if (no==='04') return '<svg viewBox="0 0 360 70"><circle cx="100" cy="35" r="'+(10+p.z1*0.4)+'" fill="none" stroke="#43c2cb"/><circle cx="260" cy="35" r="'+(10+p.z2*0.25)+'" fill="none" stroke="#eb9b4c"/></svg>';
  if (no==='08') { var pts=''; for(var i=0;i<=60;i++){ var rr=0.2+i*1.8/60; var aa=1/Math.sqrt(Math.pow(1-rr*rr,2)+Math.pow(2*p.z*rr,2)); var x=30+i*5; var y=60-Math.min(aa,6)*7; pts+=(i===0?'M':'L')+x+' '+y; } return '<svg viewBox="0 0 360 70"><path d="'+pts+'" fill="none" stroke="#43c2cb" stroke-width="2"/></svg>'; }
  return '<svg viewBox="0 0 360 50"><text x="20" y="30" fill="#43c2cb" font-size="13">'+no+'</text></svg>';
}

var toc = document.getElementById('toc');
var box = document.getElementById('units');
U.forEach(function(u) {
  var no=u[0], title=u[1], desc=u[2];
  var a = document.createElement('a');
  a.href = '#u'+no;
  a.innerHTML = '<span>'+no+'</span>'+title;
  toc.appendChild(a);

  var sec = document.createElement('section');
  sec.id = 'u'+no;
  sec.innerHTML = '<div class="sec-no">'+no+'</div><h2>'+title+'</h2><p>'+desc+'</p>';
  var figEl = document.createElement('div');
  figEl.className = 'fig';
  sec.appendChild(figEl);

  if (u[3]==='cards') {
    var cards = document.createElement('div');
    cards.className = 'cards';
    u[4].forEach(function(it){ cards.innerHTML += '<div class="card"><div class="k">'+it[0]+'</div><div class="v">'+it[1]+'</div></div>'; });
    sec.appendChild(cards);
    figEl.innerHTML = fig(no, {});
  } else {
    var sliders = u[3];
    var calc = u[4];
    var bench = document.createElement('div');
    bench.className = 'bench';
    var ctrls = document.createElement('div');
    ctrls.className = 'controls';
    sliders.forEach(function(s) {
      var d = document.createElement('div');
      d.className = 'ctl';
      d.innerHTML = '<label>'+s[0]+'<output id="o'+no+s[0]+'">'+s[3]+'</output></label><input type="range" id="i'+no+s[0]+'" min="'+s[1]+'" max="'+s[2]+'" value="'+s[3]+'" step="'+(s[1]<1?0.01:1)+'">';
      ctrls.appendChild(d);
    });
    var res = document.createElement('div');
    res.className = 'cards';
    res.innerHTML = '<div class="card"><div class="k">結果</div><div class="v" id="r'+no+'"></div></div>';
    bench.appendChild(ctrls);
    bench.appendChild(res);
    sec.appendChild(bench);

    function update() {
      var p = {};
      sliders.forEach(function(s) {
        var inp = document.getElementById('i'+no+s[0]);
        document.getElementById('o'+no+s[0]).textContent = inp.value;
        p[s[0]] = +inp.value;
      });
      document.getElementById('r'+no).textContent = calc(p);
      figEl.innerHTML = fig(no, p);
    }
    sliders.forEach(function(s) {
      document.getElementById('i'+no+s[0]).addEventListener('input', update);
    });
    update();
  }
  box.appendChild(sec);
});
</script>
</body>
</html>
