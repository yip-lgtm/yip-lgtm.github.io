<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機械工程知識地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1618;--panel:#152024;--ink:#e3ecec;--muted:#93a4a9;--line:#2a3b40;--accent:#43c2cb;--chip:#1d2c30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC",system-ui,sans-serif;padding:0 16px 100px}
.wrap{max-width:900px;margin:0 auto}
header{padding:32px 0 8px}
.eyebrow{font:600 .78rem "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(1.6rem,6vw,2.6rem);font-weight:900;margin:.2rem 0 .4rem}
.lede{color:var(--muted);margin:0 0 16px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.toc a{font-size:.9rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 14px 10px 10px;background:var(--panel);display:inline-flex;gap:6px;align-items:center;min-height:44px}
.toc a:active{border-color:var(--accent)}
.toc span{font:600 .75rem "IBM Plex Mono",monospace;color:var(--accent);background:var(--chip);border-radius:999px;padding:2px 8px}
section{margin-top:36px;scroll-margin-top:20px}
.sec-no{font:600 .8rem "IBM Plex Mono",monospace;color:var(--muted)}
h2{font-size:1.4rem;font-weight:900;margin:.2rem 0 .4rem}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.ctl{margin-bottom:12px}
.ctl label{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--accent);height:40px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--chip)}
.card .k{font-size:.78rem;color:var(--muted)}
.card .v{font:600 1.15rem "IBM Plex Mono",monospace}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Self-study</div>
  <h1>機械工程知識地圖</h1>
  <p class="lede">31 個單元。按目錄跳轉，拖動參數即時更新。</p>
  <nav class="toc" id="toc"></nav>
</header>
<div id="units"></div>
<p style="margin-top:24px"><a href="https://yip-lgtm.github.io/hd-me-lab/#/solidworks" style="color:var(--accent)">← Lab</a></p>
</div>
<script>
(function(){
  var data = [
    {no:'01',t:'基礎底座',d:'機原、材力、機設、手冊',cards:['機原 / 運動學','材力 / 強度剛度','機設 / 標準件','手冊 / 查表']},
    {no:'02',t:'彈簧 F=kx',d:'拖動 k 同 x',s:[{n:'k',a:2,b:40,v:10},{n:'x',a:0,b:20,v:5}],f:function(p){return 'F = '+(p.k*p.x).toFixed(0)+' N';}},
    {no:'03',t:'簡支樑撞度',d:'delta = FL^3/(48EI)',s:[{n:'F',a:200,b:4000,v:1000},{n:'L',a:400,b:1600,v:800}],f:function(p){return 'delta = '+(p.F*Math.pow(p.L,3)/(48*200000*1e5)).toFixed(2)+' mm';}},
    {no:'04',t:'齒輪比',d:'i = z2/z1',s:[{n:'z1',a:12,b:40,v:20},{n:'z2',a:20,b:80,v:40}],f:function(p){return 'i = '+(p.z2/p.z1).toFixed(2);}},
    {no:'05',t:'應力集中',d:'Kt 概念',s:[{n:'dw',a:0.1,b:0.6,v:0.3}],f:function(p){return 'Kt ~ '+(2+2*p.dw).toFixed(2);}},
    {no:'06',t:'伯努利',d:'動壓',s:[{n:'v',a:1,b:20,v:5}],f:function(p){return '動壓 = '+(0.5*1000*p.v*p.v/1000).toFixed(1)+' kPa';}},
    {no:'07',t:'螺栓預緊',d:'Fi ~ T/(0.2d)',s:[{n:'T',a:5,b:80,v:20},{n:'d',a:6,b:20,v:10}],f:function(p){return 'Fi ~ '+(p.T/(0.2*(p.d/1000))/1000).toFixed(1)+' kN';}},
    {no:'08',t:'共振放大',d:'頻率比 + 阻尼',s:[{n:'r',a:0.2,b:2,v:0.8},{n:'z',a:0.01,b:0.3,v:0.05}],f:function(p){return '放大 = '+(1/Math.sqrt(Math.pow(1-p.r*p.r,2)+Math.pow(2*p.z*p.r,2))).toFixed(2)+'x';}},
    {no:'09',t:'疲勞 S-N',d:'N = C/sa^3',s:[{n:'sa',a:50,b:400,v:200}],f:function(p){return 'N ~ '+(1e14/Math.pow(p.sa,3)).toExponential(1);}},
    {no:'10',t:'網格概念',d:'網格越細越準',s:[{n:'n',a:2,b:12,v:4}],f:function(p){return p.n+' x 2 單元';}},
    {no:'11',t:'熱膨脹',d:'dL = a L dT',s:[{n:'L',a:100,b:2000,v:500},{n:'dT',a:10,b:200,v:50}],f:function(p){return 'dL ~ '+(12e-6*p.L*p.dT).toFixed(2)+' mm';}},
    {no:'12',t:'扭轉角',d:'theta = TL/(GJ)',s:[{n:'T',a:10,b:200,v:50},{n:'L',a:100,b:1000,v:300}],f:function(p){return 'theta ~ '+(p.T*p.L/(80e3*1e5)*1000).toFixed(2)+' deg';}},
    {no:'13',t:'安全係數',d:'n = sy/s',s:[{n:'sy',a:200,b:800,v:400},{n:'s',a:50,b:400,v:150}],f:function(p){return 'n = '+(p.sy/p.s).toFixed(2);}},
    {no:'14',t:'帶傳動比',d:'i = D2/D1',s:[{n:'D1',a:50,b:200,v:80},{n:'D2',a:80,b:400,v:160}],f:function(p){return 'i = '+(p.D2/p.D1).toFixed(2);}},
    {no:'15',t:'軸承壽命',d:'L10 ~ (C/P)^3',s:[{n:'C',a:5,b:50,v:20},{n:'P',a:1,b:20,v:5}],f:function(p){return 'L10 ~ '+(Math.pow(p.C/p.P,3)*1e6).toExponential(1);}},
    {no:'16',t:'雷諾數',d:'Re = rho v D / mu',s:[{n:'v',a:0.1,b:5,v:1},{n:'D',a:10,b:100,v:25}],f:function(p){return 'Re ~ '+(1000*p.v*(p.D/1000)/0.001).toFixed(0);}},
    {no:'17',t:'管道壓降',d:'dp ~ L v^2',s:[{n:'v',a:1,b:10,v:3},{n:'L',a:5,b:50,v:20}],f:function(p){return 'dp ~ '+(0.02*(p.L/0.05)*500*p.v*p.v/1000).toFixed(1)+' kPa';}},
    {no:'18',t:'彈簧能量',d:'U = 0.5 k x^2',s:[{n:'k',a:5,b:50,v:15},{n:'x',a:1,b:15,v:5}],f:function(p){return 'U = '+(0.5*p.k*p.x*p.x).toFixed(1)+' N mm';}},
    {no:'19',t:'應力應變',d:'E = s/e',s:[{n:'s',a:50,b:400,v:150}],f:function(p){return 'e = '+(p.s/200000*100).toFixed(3)+' %';}},
    {no:'20',t:'彎矩',d:'M = FL/4',s:[{n:'F',a:100,b:2000,v:500},{n:'L',a:200,b:1000,v:600}],f:function(p){return 'M = '+(p.F*p.L/4/1000).toFixed(1)+' N m';}},
    {no:'21',t:'凸輪升程',d:'最大升程',s:[{n:'h',a:5,b:30,v:15}],f:function(p){return '最大 '+p.h+' mm';}},
    {no:'22',t:'四桿機構',d:'曲柄角度',s:[{n:'th',a:0,b:360,v:45}],f:function(p){return '輸出 ~ '+(p.th*0.6).toFixed(0)+' deg';}},
    {no:'23',t:'接觸應力',d:'Hertz 簡化',s:[{n:'F',a:100,b:2000,v:500},{n:'R',a:5,b:50,v:20}],f:function(p){return 's ~ '+(Math.sqrt(p.F/p.R)*10).toFixed(0)+' MPa';}},
    {no:'24',t:'Goodman',d:'平均應力影響',s:[{n:'sa',a:50,b:300,v:100},{n:'sm',a:0,b:300,v:50}],f:function(p){return '等效 ~ '+(p.sa/(1-p.sm/400)).toFixed(0);}},
    {no:'25',t:'公差堆疊',d:'線性堆疊',s:[{n:'t1',a:0.01,b:0.2,v:0.05},{n:'t2',a:0.01,b:0.2,v:0.05}],f:function(p){return '+/- '+((p.t1+p.t2)/2).toFixed(3);}},
    {no:'26',t:'自然頻率',d:'fn ~ 1/L^2',s:[{n:'L',a:300,b:1500,v:600}],f:function(p){return 'fn ~ '+(200/Math.pow(p.L/1000,2)).toFixed(1)+' Hz';}},
    {no:'27',t:'流體粘度',d:'mu 影響 Re',s:[{n:'mu',a:0.5,b:5,v:1}],f:function(p){return 'Re ~ '+(1000/p.mu).toFixed(0);}},
    {no:'28',t:'熱傳導',d:'Q = k A dT / L',s:[{n:'dT',a:10,b:100,v:40},{n:'L',a:5,b:50,v:20}],f:function(p){return 'Q ~ '+(50*0.01*p.dT/(p.L/1000)).toFixed(0)+' W';}},
    {no:'29',t:'網格收斂',d:'細分次數',s:[{n:'n',a:1,b:5,v:2}],f:function(p){return '誤差 ~ '+(10/Math.pow(2,p.n)).toFixed(2)+'%';}},
    {no:'30',t:'應用地圖',d:'不同目標組合',cards:['考研 / 機原+機設+材力','自動化 / 手冊+ANSYS','高端 / 振動+疲勞+ABAQUS','流體 / 流體+CFD']},
    {no:'31',t:'記住',d:'數值都係簡化示意',cards:['理論 / 先於按鈕','手冊 / 查表','軟體 / 驗證','實驗 / 最後']}
  ];

  var toc = document.getElementById('toc');
  var box = document.getElementById('units');

  data.forEach(function(u){
    var a = document.createElement('a');
    a.href = '#u'+u.no;
    a.innerHTML = '<span>'+u.no+'</span>'+u.t;
    toc.appendChild(a);

    var sec = document.createElement('section');
    sec.id = 'u'+u.no;
    sec.innerHTML = '<div class="sec-no">'+u.no+'</div><h2>'+u.t+'</h2><p>'+u.d+'</p>';

    if (u.cards) {
      var cards = document.createElement('div');
      cards.className = 'cards';
      u.cards.forEach(function(c){
        var parts = c.split(' / ');
        cards.innerHTML += '<div class="card"><div class="k">'+(parts[0]||'')+'</div><div class="v">'+(parts[1]||parts[0])+'</div></div>';
      });
      sec.appendChild(cards);
    } else if (u.s) {
      var bench = document.createElement('div');
      bench.className = 'bench';
      u.s.forEach(function(s){
        var d = document.createElement('div');
        d.className = 'ctl';
        d.innerHTML = '<label>'+s.n+' <output id="o'+u.no+s.n+'">'+s.v+'</output></label><input type="range" id="i'+u.no+s.n+'" min="'+s.a+'" max="'+s.b+'" value="'+s.v+'" step="'+(s.a<1?0.01:1)+'">';
        bench.appendChild(d);
      });
      var res = document.createElement('div');
      res.className = 'cards';
      res.innerHTML = '<div class="card"><div class="k">結果</div><div class="v" id="r'+u.no+'"></div></div>';
      bench.appendChild(res);
      sec.appendChild(bench);

      function upd(){
        var p = {};
        u.s.forEach(function(s){
          var inp = document.getElementById('i'+u.no+s.n);
          document.getElementById('o'+u.no+s.n).textContent = inp.value;
          p[s.n] = +inp.value;
        });
        document.getElementById('r'+u.no).textContent = u.f(p);
      }
      u.s.forEach(function(s){
        document.getElementById('i'+u.no+s.n).addEventListener('input', upd);
      });
      upd();
    }
    box.appendChild(sec);
  });
})();
</script>
</body>
</html>
